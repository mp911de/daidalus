name: C++ Regression Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build library and examples
        run: make -C C++ -j"$(nproc)"
      - name: Run regression suite
        run: |
          make -C Regression moldcpp
          make -C Regression diffcpp
